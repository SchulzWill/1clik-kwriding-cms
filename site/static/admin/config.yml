backend:
  name: git-gateway
  branch: main

# Media files location
media_folder: "site/static/img"
public_folder: "/img"

# Site settings
site_url: https://kwriding.netlify.app
display_url: https://kwriding.netlify.app
logo_url: /img/logo.png

collections:
  # ============================================
  # LONG TRIPS - Multi-day adventures
  # ============================================
  - name: "long-trips"
    label: "Long Trips"
    label_singular: "Long Trip"
    folder: "site/content/categories/long-trips"
    create: true
    nested:
      depth: 2
    meta: { path: { widget: string, label: 'Path', index_file: 'index' } }
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Name of your trip/adventure"
      - label: "Date"
        name: "date"
        widget: "datetime"
        hint: "When did this trip happen?"
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "Brief description shown in album listings"
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - { label: "Long Trips", value: "long-trips" }
          - { label: "Day Trips", value: "day-trips" }
        hint: "Select one or more categories"
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Show this trip on the homepage?"
      - label: "Private"
        name: "private"
        widget: "boolean"
        default: false
        required: false
        hint: "Hide from public listings (accessible by direct link only)"
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Detailed trip description, route info, highlights"

  # ============================================
  # DAY TRIPS - Single-day rides
  # ============================================
  - name: "day-trips"
    label: "Day Trips"
    label_singular: "Day Trip"
    folder: "site/content/categories/day-trips"
    create: true
    nested:
      depth: 2
    meta: { path: { widget: string, label: 'Path', index_file: 'index' } }
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Name of your day trip"
      - label: "Date"
        name: "date"
        widget: "datetime"
        hint: "When did this ride happen?"
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "Brief description shown in album listings"
      - label: "Categories"
        name: "categories"
        widget: "hidden"
        default: ["day-trips"]
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Show this on the homepage?"
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Trip description, route info, highlights"

  # ============================================
  # PAGES - Static Pages
  # ============================================
  - name: "pages"
    label: "Pages"
    files:
      # Homepage
      - file: "site/content/_index.md"
        label: "Homepage"
        name: "home"
        fields:
          - label: "Site Title"
            name: "title"
            widget: "string"
          - label: "Site Description"
            name: "description"
            widget: "text"
            hint: "Used for SEO and social sharing"

      # About Page
      - file: "site/content/about.md"
        label: "About Page"
        name: "about"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "prose"
          - label: "Content"
            name: "body"
            widget: "markdown"
            hint: "Tell your story - who you are, what you ride, your passion for motorcycles"

      # Gear Page
      - file: "site/content/gear/index.md"
        label: "Gear Page"
        name: "gear"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Date"
            name: "date"
            widget: "datetime"
          - label: "Description"
            name: "description"
            widget: "text"
          - label: "Content"
            name: "body"
            widget: "markdown"
            hint: "Describe your motorcycle, camera gear, riding equipment"

  # ============================================
  # SETTINGS - Site Configuration
  # ============================================
  - name: "settings"
    label: "Settings"
    files:
      - file: "site/config.toml"
        label: "Site Settings"
        name: "config"
        fields:
          - label: "Site URL"
            name: "baseurl"
            widget: "string"
          - label: "Site Title"
            name: "title"
            widget: "string"
          - label: "Copyright"
            name: "copyright"
            widget: "string"
          - label: "Language Code"
            name: "languageCode"
            widget: "string"
            default: "en-us"
