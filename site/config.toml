baseurl = "/"
languageCode = "en-us"
title = "KW Riding"
copyright = "© KW Riding"

# Theme configuration
themesDir = "../themes"
theme = "theme-gallery"

# Enable for gallery theme
enableRobotsTXT = true
timeout = "120s"

# Theme parameters
[params]
  defaultTheme = "dark"
  description = "Motorcycle trip planning, tours, and routes by Kay & Will — Brazilians exploring the world on two wheels"
  title = "KW Riding"
  [params.author]
    name = "Kay & Will"
    email = ""
  [params.socialIcons]
    instagram = "https://www.instagram.com/kwriding/"
    youtube = "https://www.youtube.com/@KWRiding"

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

# Image processing
[imaging]
  quality = 75
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

# Menu
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
