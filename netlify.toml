[build.environment]
  NETLIFY_USE_YARN = "false"
  YARN_VERSION = "1.22.17"

[build]
  command = "npm build"
  publish = "dist"

[context.deploy-preview]
  command = "npm build:preview"

[dev]
  framework = "hugo"
  targetPort = 3000

[[plugins]]
  package = "netlify-plugin-cypress"

  [plugins.inputs]
    record = true